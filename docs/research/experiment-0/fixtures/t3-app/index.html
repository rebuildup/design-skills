<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fieldnote Spec Review Workbench</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <img src="./assets/fieldnote-mark.svg" alt="Fieldnote" width="32" height="32">
      <div>
        <h1>Fieldnote Spec Review Workbench</h1>
        <p id="workspace-meta">Loading workspace...</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="box" aria-labelledby="summary-heading">
      <h2 id="summary-heading">Queue Summary</h2>
      <p id="summary-prose">Loading review queue summary...</p>
    </section>

    <section class="box" aria-labelledby="controls-heading">
      <h2 id="controls-heading">Filter and Search Specifications</h2>
      <div class="controls-row">
        <label for="search-input">Search specifications:</label>
        <input id="search-input" type="search" placeholder="Search by ID, title, owner, or domain...">
      </div>
      <div class="filter-buttons" role="group" aria-label="Filter by status">
        <button type="button" class="filter-btn active" data-status="all">All (0)</button>
        <button type="button" class="filter-btn" data-status="needs-review">Needs Review (0)</button>
        <button type="button" class="filter-btn" data-status="changes-requested">Changes Requested (0)</button>
        <button type="button" class="filter-btn" data-status="approved">Approved (0)</button>
      </div>
    </section>

    <section class="box" aria-labelledby="list-heading">
      <h2 id="list-heading">Specification List</h2>
      <div id="spec-list" class="spec-list"></div>
    </section>

    <section class="box" aria-labelledby="detail-heading">
      <h2 id="detail-heading">Selected Specification Details</h2>
      <div id="spec-detail">Select a specification above to view details.</div>
    </section>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
