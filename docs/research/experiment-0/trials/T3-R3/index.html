<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fieldnote Spec Review Workbench</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <img src="./assets/fieldnote-mark.svg" alt="Fieldnote" width="32" height="32">
    <div class="topbar-title">
      <h1>Fieldnote Spec Review Workbench</h1>
      <p id="workspace-meta">Loading workspace...</p>
    </div>
  </header>

  <section class="overview" aria-label="Queue overview" id="overview">
    <p class="sr-only" id="summary-prose" aria-live="polite">Loading review queue summary...</p>
    <div class="overview-grid" id="overview-grid"></div>
  </section>

  <main class="workbench">
    <section class="queue" aria-labelledby="list-heading">
      <h2 id="list-heading">Review queue</h2>
      <div class="controls">
        <label class="sr-only" for="search-input">Search specifications</label>
        <input id="search-input" type="search" placeholder="Search ID, title, owner, domain" autocomplete="off">
        <div class="filter-buttons" role="group" aria-label="Filter by status">
          <button type="button" class="filter-btn active" data-status="all" aria-pressed="true">All (0)</button>
          <button type="button" class="filter-btn" data-status="needs-review" aria-pressed="false">Needs Review (0)</button>
          <button type="button" class="filter-btn" data-status="changes-requested" aria-pressed="false">Changes Requested (0)</button>
          <button type="button" class="filter-btn" data-status="approved" aria-pressed="false">Approved (0)</button>
        </div>
      </div>
      <div id="spec-list" class="spec-list"></div>
    </section>

    <section class="detail" id="detail-panel" aria-labelledby="detail-heading" tabindex="-1">
      <h2 id="detail-heading" class="sr-only">Selected specification details</h2>
      <div id="spec-detail">Select a specification to view details.</div>
    </section>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
